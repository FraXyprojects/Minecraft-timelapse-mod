name: Build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build
        run: gradle --no-daemon build

      - name: Upload built JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fraxy-timelapse-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
